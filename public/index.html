<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportador do ScreenMatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-cover bg-center bg-fixed bg-no-repeat px-5 py-10 text-white" style="background-image: url('https://i.pinimg.com/originals/2f/69/d3/2f69d3a16cd859690167379731c6ade3.gif');">
<div class="fixed inset-0 bg-black/70"></div>
<main class="relative z-10 mx-auto max-w-xl">
    <section class="mb-8 text-center">
        <h1 class="text-3xl font-bold md:text-4xl">ScreenMatch</h1>
        <p class="mt-2 text-gray-300">Cadastre um filme e exporte as informações para JSON</p>
    </section>
    <section class="rounded-2xl bg-white p-6 text-slate-900 shadow-2xl">
        <h2 class="mb-5 text-2xl font-bold text-[#141e30]">Exportar filme</h2>
        <form action="exporta-arquivo.php" method="post">
            <fieldset class="mb-4 border-0 p-0">
                <label for="nome" class="mb-1.5 block font-bold">Nome:</label>
                <input type="text" name="nome" id="nome" placeholder="Digite o nome do filme" required class="w-full rounded-lg border border-gray-300 p-3 text-[15px] outline-none transition focus:border-[#141e30] focus:ring-2 focus:ring-[#141e30]">
            </fieldset>
            <fieldset class="mb-4 border-0 p-0">
                <label for="ano" class="mb-1.5 block font-bold">Ano de lançamento:</label>
                <input type="number" name="ano" id="ano" min="1888" max="2030" placeholder="Ex: 2025" required class="w-full rounded-lg border border-gray-300 p-3 text-[15px] outline-none transition focus:border-[#141e30] focus:ring-2 focus:ring-[#141e30]">
            </fieldset>
            <fieldset class="mb-4 border-0 p-0">
                <label for="nota" class="mb-1.5 block font-bold">Nota:</label>
                <input type="number" name="nota" id="nota" min="0" max="10" step="0.1" placeholder="Ex: 9.8" required class="w-full rounded-lg border border-gray-300 p-3 text-[15px] outline-none transition focus:border-[#141e30] focus:ring-2 focus:ring-[#141e30]">
            </fieldset>
            <fieldset class="mb-4 border-0 p-0">
                <label for="genero" class="mb-1.5 block font-bold">Gênero:</label>
                <select name="genero" id="genero" required class="w-full rounded-lg border border-gray-300 p-3 text-[15px] outline-none transition focus:border-[#141e30] focus:ring-2 focus:ring-[#141e30]">
                    <option value="">Selecione um gênero</option>
                    <option value="super-heroi">Super-herói</option>
                    <option value="comedia">Comédia</option>
                    <option value="acao">Ação</option>
                    <option value="drama">Drama</option>
                    <option value="terror">Terror</option>
                    <option value="ficcao-cientifica">Ficção científica</option>
                </select>
            </fieldset>
            <button type="submit" class="mt-2 w-full rounded-lg bg-[#141e30] px-4 py-3.5 font-bold text-white transition hover:bg-[#243b55]">
                Exportar filme
            </button>
        </form>
    </section>
</main>
</body>
</html>
