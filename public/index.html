<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportador do ScreenMatch</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        main {
            max-width: 500px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
        }

        fieldset {
            border: none;
            margin: 0 0 16px;
            padding: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #222222;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #444444;
        }
    </style>
</head>
<body>
<main>
    <h1>Exportador do ScreenMatch</h1>

    <form action="exporta-arquivo.php" method="post">
        <fieldset>
            <label for="nome">Nome:</label>
            <input
                    type="text"
                    name="nome"
                    id="nome"
                    placeholder="Digite o nome do filme"
                    required
            >
        </fieldset>

        <fieldset>
            <label for="ano">Ano de lançamento:</label>
            <input
                    type="number"
                    name="ano"
                    id="ano"
                    min="1888"
                    max="2030"
                    placeholder="Ex: 2025"
                    required
            >
        </fieldset>

        <fieldset>
            <label for="nota">Nota:</label>
            <input
                    type="number"
                    name="nota"
                    id="nota"
                    min="0"
                    max="10"
                    step="0.1"
                    placeholder="Ex: 9.8"
                    required
            >
        </fieldset>

        <fieldset>
            <label for="genero">Gênero:</label>
            <select name="genero" id="genero" required>
                <option value="">Selecione um gênero</option>
                <option value="super-heroi">Super-herói</option>
                <option value="comedia">Comédia</option>
                <option value="acao">Ação</option>
                <option value="drama">Drama</option>
                <option value="terror">Terror</option>
                <option value="ficcao-cientifica">Ficção científica</option>
            </select>
        </fieldset>

        <button type="submit">Exportar filme</button>
    </form>
</main>
</body>
</html>
